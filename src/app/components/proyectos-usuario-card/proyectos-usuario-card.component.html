@if (!deleted) {
  <div class="bg-light card shadow-sm mb-3 mt-5 hover-card" style="border-radius: 12px;">
    <div class="card-body">
      <!-- Encabezado -->
      <div class="d-flex align-items-center mb-2">
        <a (click)="verProyecto()"
           class="text-decoration-none text-dark card-trigger"
           [ngClass]="{'sinCursor': esEditable}">
          <img [src]="proyectoUnico.foto"
               [alt]="'Imagen de ' + proyectoUnico.nombre"
               class="rounded-circle border me-3"
               style="width: 50px; height: 50px; object-fit: cover;">
        </a>
        <h5 class="m-0 fw-bold flex-grow-1">{{ proyectoUnico.nombre }}</h5>

        @if (!esEditable) {
          <button (click)="toggleFavorita()"
                  class="p-0 m-0 border-0 bg-transparent"
                  style="outline:none; box-shadow:none; cursor:pointer;"
                  [attr.aria-label]="proyectoUnico.esFavorito ? 'Quitar de favoritos' : 'Añadir a favoritos'">
            @if (proyectoUnico.esFavorito) {
              <i class="fa-solid fa-star"></i>
            } @else {
              <i class="fa-regular fa-star"></i>
            }
          </button>
        }
      </div>

      <!-- Plazas -->
      <div class="d-flex align-items-center mb-2">
        <i class="fa-solid fa-user me-2" aria-hidden="true"></i>
        <span class="me-auto small">{{ proyectoUnico.plazasDisponibles }}</span>
        <i class="fa-regular fa-face-smile" aria-hidden="true"></i>
      </div>

      <!-- Descripción e imagen -->
      <a (click)="verProyecto()"
         class="text-decoration-none text-dark card-trigger"
         [ngClass]="{'sinCursor': esEditable}">
        <p class="mb-3 text-wrap" style="font-size: 0.9rem;">
          {{ proyectoUnico.descripcion }}
        </p>
        <app-image-loader
          [src]="proyectoUnico.fotoContenido"
          [alt]="proyectoUnico.nombre"
          width="100%"
          height="200px">
        </app-image-loader>
      </a>

      @if (esEditable) {
        <div class="mt-2 d-flex justify-content-center gap-2">
          <app-boton-edit-proyecto
            [proyectoId]="proyectoUnico.idProyecto"
            (onDelete)="onDeleteClicked($event)">
          </app-boton-edit-proyecto>
        </div>
      }
    </div>
  </div>
}
