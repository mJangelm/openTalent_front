<div class="actions-container">
  <!-- Botón Editar -->
  <button mat-mini-fab
          [routerLink]="['/usuario/misproyectos/edit/', proyectoId]"
          class="action-button edit-button">
    <mat-icon>edit</mat-icon>
  </button>

  <!-- Botón Ver Postulantes -->
  <button mat-mini-fab
          [routerLink]="['/usuario/misproyectos/postulantes/', proyectoId]"
          class="action-button applicants-button">
    <mat-icon>group</mat-icon>
  </button>

  <!-- Botón Eliminar -->
  <button mat-mini-fab
          (click)="handleDelete()"
          class="action-button delete-button">
    <mat-icon>delete</mat-icon>
  </button>
</div>
