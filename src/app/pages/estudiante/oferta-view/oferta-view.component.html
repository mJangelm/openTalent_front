<section class="container mt-3">
    <div class="card shadow p-3">
        <div class="row">
            <figure class="col-12 col-md-3">
                <img class="img-fluid" [src]="miOferta.fotoEmpresa">
            </figure>
            <div class="col-12 col-md-9">
                <h2>{{miOferta.titulo}}</h2>
                <hr>
                <p>Descripción: {{miOferta.descripcion}}</p>
                <p>Direccion: {{miOferta.direccionEmpresa?.pais}}, {{miOferta.direccionEmpresa?.provincia}}</p>

            </div>
        </div>
    </div>
</section>
