<div class="container">
  <div class="row">
    @for (proyecto of arrProyectos; track proyecto.idProyecto) {
      <div class="col-md-4 mb-3">
        <div class="proyecto-wrapper" [attr.data-id]="proyecto.idProyecto">
          <app-proyectos-usuario-card
            [esEditable]="editable"
            [proyectoUnico]="proyecto"
            (projectDeleted)="handleProjectDeleted($event)">
          </app-proyectos-usuario-card>
        </div>
      </div>
    }
    @empty {
      <div class="col-12 text-center text-muted">
        <p class="fs-5">No hay proyectos disponibles.</p>
      </div>
    }
  </div>
</div>
