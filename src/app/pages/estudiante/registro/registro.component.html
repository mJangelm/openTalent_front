<section>
    <app-header-registro></app-header-registro>
</section>

<section style="text-align:center">
  <h2>Registrarse como estudiante</h2>
</section>
<br>
<br>

<div class="container">
    <form [formGroup]="modelForm" (ngSubmit)="getDataForm()">
      <div class="row">
       
        <div class="col-md-4">
            <div>
                <label for="name">Nombre</label>
                <input type="text" name="name" id="name" placeholder="Introduce tu nombre" formControlName="name" class="form-control">
              </div>
          
              <div>
                <label for="apellido">Apellido</label>
                <input type="text" name="apellido" id="apellido" placeholder="Introduce tu apellido" class="form-control" formControlName="apellido">
              </div>
          
              <div>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Introduce tu email"  class="form-control" formControlName="email">
              </div>
          
              <div>
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Introduce tu contraseña" class="form-control" formControlName="password">
              </div>
          
              <!-- <div>
                <label for="repitePassword">Repetir Contraseña</label>
                <input type="password" name="repitePassword" id="repitePassword" placeholder="Repite tu contraseña"  class="form-control" formControlName="repitePassword">
              </div> -->
              <div>
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date" class="form-control"  name="fechaNacimiento" id="fechaNacimiento" formControlName="fechaNacimiento">
              </div>
        </div>
        <!-- Columna 2 -->
        <div class="col-md-4">

          
              <div>
                <label for="telefono">Teléfono</label>
                <input type="tel" class="form-control" name="telefono" id="telefono" placeholder="Introduce tu teléfono" formControlName="telefono">
              </div>
          
              <div>
                <label for="pais">País</label>
                <input type="text" class="form-control"  name="pais" id="pais" placeholder="Introduce tu país" formControlName="pais">
              </div>
          
              <div>
                <label for="calle">Calle</label>
                <input type="text" class="form-control" name="calle" id="calle" placeholder="Introduce tu calle" formControlName="calle">
              </div>

              <div>
                <label for="poblacion">Población</label>
                <input type="text" class="form-control"  name="poblacion" id="poblacion" placeholder="Introduce tu población" formControlName="poblacion">
              </div>
        </div>
        <!-- Columna 3 -->
        <div class="col-md-4">
            <div>
                <label for="cp">Código Postal</label>
                <input type="text" class="form-control"  name="cp" id="cp" placeholder="Introduce tu CP" formControlName="cp">
              </div>
          
              <div>
                <label for="provincia">Provincia</label>
                <input type="text" class="form-control" name="provincia" id="provincia" placeholder="Introduce tu provincia" formControlName="provincia">
              </div>
          
              <div>
                <label for="estudiosExperiencia">Estudios / Experiencia</label>
                <textarea class="form-control" name="estudiosExperiencia" id="estudiosExperiencia" placeholder="Introduce tus estudios y experiencia" formControlName="estudiosExperiencia"></textarea>
              </div>
              <br>

              <div>
                <label for="pdfFile">Adjuntar PDF</label>


                <input type="file" id="pdfFile" accept="application/pdf" (change)="onFileChangePdf($event)" class="form-control">
              </div>
                <br>
              <div>
                <label for="jpgFile">Introduce foto de perfil</label>
                <input type="file" id="jpgFile" accept=".jpg,.jpeg, .png"  (change)="onFileChangeJpg($event)" class="form-control">
              </div>
        </div>
      </div>
      <br>
      <br>
      <br>
      <input type="submit" value="Registrarse" class="btn btn-primary">

        <button class="btn btn-primary" style="margin-left:800px">Volver</button>

  
    </form>
  </div>
