<div class="text-center mb-4">
  <h2>Añadir nuevo proyecto</h2>
</div>

<form [formGroup]="modelForm" (ngSubmit)="onSubmit()">
  <div class="row">
    <!-- Columna 1 -->
    <div class="col-md-6">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre del proyecto</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" placeholder="Introduce el nombre">
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea id="descripcion" class="form-control" formControlName="descripcion" rows="4"
          placeholder="Introduce la descripción"></textarea>
      </div>
    </div>

    <!-- Columna 2 -->
    <div class="col-md-3">
      <div class="mb-3">
        <label for="fechaInicio" class="form-label">Fecha inicio</label>
        <input id="fechaInicio" type="date" class="form-control" formControlName="fechaInicio">
      </div>
      <div class="mb-3">
        <label for="fechaFin" class="form-label">Fecha fin</label>
        <input id="fechaFin" type="date" class="form-control" formControlName="fechaFin">
      </div>
    </div>

    <!-- Columna 3 -->
    <div class="col-md-3">
      <div class="mb-3">
        <label for="foto" class="form-label">URL foto principal</label>
        <input id="foto" type="text" class="form-control" formControlName="foto" placeholder="Introduce URL de la foto">
      </div>
      <div class="mb-3">
        <label for="fotoContenido" class="form-label">URL foto de contenido</label>
        <input id="fotoContenido" type="text" class="form-control" formControlName="fotoContenido"
          placeholder="Introduce URL de la foto de contenido">
      </div>
      <div class="mb-3">
        <label for="plazas" class="form-label">Número de plazas</label>
        <input id="plazas" type="number" class="form-control" formControlName="plazas" min="1"
          placeholder="Introduce plazas">
      </div>
    </div>
  </div>

  <div class="text-center mt-4">
    <button type="button" class="btn btn-secondary me-2" (click)="volver()">Volver</button>
    <button type="submit" class="btn btn-primary" [disabled]="modelForm.invalid">Guardar</button>
  </div>
</form>
