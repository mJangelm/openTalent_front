
<div class="text-center"><h2>Añadir nuevo proyecto</h2></div>
<br>
<form [formGroup]="modelForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <!-- Columna 1: Nombre y descripción -->
      <div class="col-md-6">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre del proyecto</label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            class="form-control"
            placeholder="Introduce el nombre"
          />
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea
            id="descripcion"
            formControlName="descripcion"
            class="form-control"
            rows="4"
            placeholder="Introduce la descripción"
          ></textarea>
        </div>
      </div>
  
      <!-- Columna 2: Fechas -->
      <div class="col-md-3">
        <div class="mb-3">
          <label for="fechaInicio" class="form-label">Fecha inicio</label>
          <input
            type="date"
            id="fechaInicio"
            formControlName="fechaInicio"
            class="form-control"
          />
        </div>
        <div class="mb-3">
          <label for="fechaFin" class="form-label">Fecha fin</label>
          <input
            type="date"
            id="fechaFin"
            formControlName="fechaFin"
            class="form-control"
          />
        </div>
      </div>
  
      <!-- Columna 3: Fotos, plazas y activo -->
      <div class="col-md-3">
        <div class="mb-3">
          <label for="foto" class="form-label">URL foto principal</label>
          <input
            type="text"
            id="foto"
            formControlName="foto"
            class="form-control"
            placeholder="Introduce URL de la foto"
          />
        </div>
        <div class="mb-3">
          <label for="fotoContenido" class="form-label">URL foto de contenido</label>
          <input
            type="text"
            id="fotoContenido"
            formControlName="fotoContenido"
            class="form-control"
            placeholder="Introduce URL de la foto de contenido"
          />
        </div>
        <div class="mb-3">
          <label for="plazas" class="form-label">Número de plazas</label>
          <input
            type="number"
            id="plazas"
            formControlName="plazas"
            class="form-control"
            min="1"
            placeholder="Introduce plazas"
          />
        </div>
        <!-- <div class="form-check">
          <input
            type="checkbox"
            id="activo"
            formControlName="activo"
            class="form-check-input"
          />
          <label for="activo" class="form-check-label">Activo</label>
        </div> -->
      </div>
    </div>
  
    <div class="d-flex justify-content-center mt-4">
      <button type="button" class="btn btn-secondary me-2" (click)="volver()">Volver</button>
      <button type="submit" class="btn btn-primary" [disabled]="modelForm.invalid">
        Guardar
      </button>
    </div>
  </form>
