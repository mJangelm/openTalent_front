<div class="container">
  <!-- Título con diseño mejorado -->
  <div class="title-section">
    <div class="title-container">
      <h2 class="main-title">
        <i class="fas fa-users title-icon"></i>
        <span class="title-text animate-title">Postulantes</span>
      </h2>
      <div class="title-underline"></div>
    </div>
  </div>

  <!-- Spinner de carga -->
  @if (isLoading) {
    <div class="loader-container">
      <div class="loader">
        <mat-spinner diameter="50" color="primary"></mat-spinner>
        <p class="loader-text">Cargando postulantes...</p>
      </div>
    </div>
  } @else {
    <div class="row">
      @if (arrPostulantes.length) {
        @for (postulante of arrPostulantes; track postulante.idUsuario) {
          <div class="col-md-4 mb-3" [attr.data-id]="postulante.idUsuario">
            <app-postulante-card
              [postulanteUnico]="postulante"
              [idOferta]="idOferta"
              [tipo]="'oferta'"
              (onAccept)="handleAcceptPostulante($event)"
              (onReject)="handleRejectPostulante($event)">
            </app-postulante-card>
          </div>
        }
      } @else {
        <div class="col-12 text-center">
          <p class="text-muted">No hay postulantes disponibles.</p>
        </div>
      }
    </div>
  }
</div>
