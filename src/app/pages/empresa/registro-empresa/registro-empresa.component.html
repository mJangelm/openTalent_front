<form [formGroup]="modelForm" (ngSubmit)="registro()">
  <div class="row">
    <!-- Columna 1 -->
    <div class="col-md-4">
      <div>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" formControlName="nombre" class="form-control" placeholder="Introduce tu nombre">
      </div>
      <div>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" formControlName="apellido" class="form-control" placeholder="Introduce tu apellido">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Introduce tu email">
      </div>
      <div>
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" formControlName="username" class="form-control" placeholder="Introduce tu nombre de usuario">
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Introduce tu contraseña">
      </div>
      <div>
        <label for="fechaNacimiento">Fecha de Nacimiento</label>
        <input type="date" id="fechaNacimiento" formControlName="fechaNacimiento" class="form-control">
      </div>
    </div>

    <!-- Columna 2 -->
    <div class="col-md-4">
      <div>
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" formControlName="telefono" class="form-control" placeholder="Introduce tu teléfono">
      </div>
      <div>
        <label for="pais">País</label>
        <input type="text" id="pais" formControlName="pais" class="form-control" placeholder="Introduce tu país">
      </div>
      <div>
        <label for="calle">Calle</label>
        <input type="text" id="calle" formControlName="calle" class="form-control" placeholder="Introduce tu calle">
      </div>
      <div>
        <label for="poblacion">Población</label>
        <input type="text" id="poblacion" formControlName="poblacion" class="form-control" placeholder="Introduce tu población">
      </div>
      <div>
        <label for="codigoPostal">Código Postal</label>
        <input type="text" id="codigoPostal" formControlName="codigoPostal" class="form-control" placeholder="Introduce tu código postal">
      </div>
      <div>
        <label for="provincia">Provincia</label>
        <input type="text" id="provincia" formControlName="provincia" class="form-control" placeholder="Introduce tu provincia">
      </div>
    </div>

    <!-- Columna 3 -->
    <div class="col-md-4">
      <div>
        <label for="fotoPerfil">Foto de perfil</label>
        <input type="text" id="fotoPerfil" formControlName="fotoPerfil" class="form-control" placeholder="Introduce la URL de tu foto de perfil">
      </div>
      <div>
        <label for="cif">CIF</label>
        <input type="text" id="cif" formControlName="cif" class="form-control" placeholder="Introduce tu CIF">
      </div>
    </div>
  </div>

  <br><br>
  <input type="submit" value="Registrarse" class="btn btn-primary">
  <button type="button" class="btn btn-secondary" style="margin-left:800px">Volver</button>
</form>
