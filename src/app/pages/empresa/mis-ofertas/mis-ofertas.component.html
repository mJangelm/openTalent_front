<div class="container">
  <!-- Loader -->
  @if (isLoading) {
    <div class="loader-container">
      <div class="loader">
        <div class="loader-circle"></div>
        <div class="loader-text">Cargando mis ofertas...</div>
      </div>
    </div>
  } @else {
    <!-- Grid de ofertas -->
    <div class="row">
      @for (oferta of arrOfertas; track oferta.idOferta) {
        <div class="col-md-4 mb-3">
          <div class="oferta-wrapper" [attr.data-id]="oferta.idOferta">
            <app-mis-ofertas-card
              [OfertaUnica]="oferta"
              (deleted)="onOfferDeleted($event)">
            </app-mis-ofertas-card>
          </div>
        </div>
      } @empty {
        <div class="col-12 text-center text-muted">
          <p class="fs-5">No hay ofertas disponibles.</p>
        </div>
      }
    </div>
  }
</div>
