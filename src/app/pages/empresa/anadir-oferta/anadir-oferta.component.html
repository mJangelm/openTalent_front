<div class="container">
  <!-- Título con diseño mejorado -->
  <div class="section-wrapper">
    <div class="section-title">
      <h2 class="main-title">
        <i class="fas fa-plus-circle title-icon"></i>
        <span class="title-text">Nueva Oferta</span>
      </h2>
      <div class="title-underline"></div>
    </div>
  </div>

  <!-- Formulario -->
  <form [formGroup]="modelForm" (ngSubmit)="registro()" class="card p-4 shadow border-0 rounded-4">
    <div class="row g-4">
      <!-- Columna 1: Datos principales -->
      <div class="col-md-6">
        <div class="mb-4">
          <label class="form-label">Título de la oferta</label>
          <div class="input-container">
            <i class="fas fa-briefcase"></i>
            <input
              type="text"
              formControlName="titulo"
              class="form-control custom-input"
              placeholder="Introduce el título"
            />
          </div>
        </div>

        <!-- Textarea descripción -->
        <div class="mb-4">
          <label class="form-label">Descripción</label>
          <div class="input-container textarea-container">
            <i class="fas fa-align-left textarea-icon"></i>
            <textarea
              formControlName="descripcion"
              class="form-control custom-input"
              rows="5"
              placeholder="Describe la oferta detalladamente"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Columna 2: Detalles -->
      <div class="col-md-6">
        <!-- Select sector -->
        <div class="mb-4">
          <label class="form-label">Sector</label>
          <div class="input-container select-container">
            <i class="fas fa-industry"></i>
            <i class="fas fa-chevron-down select-icon"></i>
            <select formControlName="nombreSector" class="form-control custom-input">
              <option value="" disabled selected>Selecciona un sector</option>
              @for(sector of arrSectores; track sector.nombre) {
                <option [value]="sector.nombre">{{ sector.nombre }}</option>
              }
            </select>
          </div>
        </div>

        <div class="row g-3">
          <!-- Select tipo oferta -->
          <div class="col-md-6">
            <label class="form-label">Tipo de oferta</label>
            <div class="input-container select-container">
              <i class="fas fa-tag"></i>
              <i class="fas fa-chevron-down select-icon"></i>
              <select formControlName="tipoOferta" class="form-control custom-input">
                <option value="" disabled selected>Selecciona tipo</option>
                <option value="PRACTICAS">Prácticas</option>
                <option value="EMPRESA">Empleo</option>
              </select>
            </div>
          </div>

          <!-- Select modalidad -->
          <div class="col-md-6">
            <label class="form-label">Modalidad</label>
            <div class="input-container select-container">
              <i class="fas fa-building"></i>
              <i class="fas fa-chevron-down select-icon"></i>
              <select formControlName="modalidad" class="form-control custom-input">
                <option value="" disabled selected>Selecciona modalidad</option>
                <option value="PRESENCIAL">Presencial</option>
                <option value="ONLINE">Remoto</option>
                <option value="MIXTO">Híbrido</option>
              </select>
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Número de plazas</label>
            <div class="input-container">
              <i class="fas fa-users"></i>
              <input
                type="number"
                formControlName="numeroPlazas"
                class="form-control custom-input"
                placeholder="Nº de plazas"
                min="1"
              />
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Fecha límite</label>
            <div class="input-container">
              <i class="fas fa-calendar"></i>
              <input
                type="date"
                formControlName="fechaFin"
                class="form-control custom-input"
              />
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">URL de la imagen</label>
          <div class="input-container">
            <i class="fas fa-image"></i>
            <input
              type="url"
              formControlName="fotoContenido"
              class="form-control custom-input"
              placeholder="https://ejemplo.com/imagen.jpg"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Botones de acción -->
    <div class="d-flex justify-content-end gap-3 mt-4">
      <button type="button" class="btn btn-secondary" (click)="volver()">
        <i class="fas fa-arrow-left me-2"></i>Volver
      </button>
      <button type="submit" class="btn btn-primary" [disabled]="modelForm.invalid">
        <i class="fas fa-save me-2"></i>Guardar oferta
      </button>
    </div>
  </form>
</div>
