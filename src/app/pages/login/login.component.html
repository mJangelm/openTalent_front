<div class="container-fluid main-container">
  <div class="background-pattern"></div>
  <div class="floating-spheres">
    <div class="sphere"></div>
    <div class="sphere"></div>
  </div>

  <div class="row min-vh-100">
    <!-- Columna izquierda: Logo y título -->
    <div class="col-md-6 left-column d-flex flex-column justify-content-center align-items-center">
      <div class="brand-container">
        <img src="assets/logo/openTalent_logo_sinletras.png" alt="Logo" class="logo">
        <h1 class="title">
          <div class="word">
            <span class="animate-text">O</span>
            <span class="animate-text">p</span>
            <span class="animate-text">e</span>
            <span class="animate-text">n</span>
          </div>
          <div class="word accent">
            <span class="animate-text">T</span>
            <span class="animate-text">a</span>
            <span class="animate-text">l</span>
            <span class="animate-text">e</span>
            <span class="animate-text">n</span>
            <span class="animate-text">t</span>
          </div>
        </h1>
      </div>
    </div>

    <!-- Columna derecha: Formulario -->
    <div class="col-md-6 right-column d-flex justify-content-center align-items-center">
      <form [formGroup]="modelForm" (ngSubmit)="getUser()" class="login-form shadow">
        <h2 class="form-title">Iniciar sesión</h2>

        <div class="form-group">
          <div class="input-container">
            <i class="fas fa-user"></i>
            <input type="text"
                   id="username"
                   formControlName="username"
                   placeholder="Tu nombre de usuario"
                   autocomplete="username"
                   class="form-control">
          </div>
        </div>

        <div class="form-group">
          <div class="input-container">
            <i class="fas fa-lock"></i>
            <input type="password"
                   id="password"
                   autocomplete="current-password"
                   formControlName="password"
                   placeholder="Tu contraseña"
                   class="form-control">
          </div>
        </div>

        <button type="submit" class="btn-login">
          Iniciar sesión
          <i class="fas fa-arrow-right"></i>
        </button>

        <div class="register-links">
          <p>¿Nuevo en OpenTalent?</p>
          <div class="links-container">
            <a [routerLink]="['/registro']" class="register-link student">
              <i class="fas fa-user-graduate"></i>
              Registro Estudiante
            </a>
            <a [routerLink]="['/registroEmpresa']" class="register-link company">
              <i class="fas fa-building"></i>
              Registro Empresa
            </a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
